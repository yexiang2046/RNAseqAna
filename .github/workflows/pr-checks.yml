name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check if title is descriptive (at least 10 characters)
          if [ ${#PR_TITLE} -lt 10 ]; then
            echo "❌ PR title too short. Please provide a descriptive title."
            exit 1
          fi
          echo "✓ PR title is descriptive"

      - name: Check for breaking changes
        run: |
          echo "Checking for potential breaking changes..."
          
          # Check if main workflow structure changed
          if git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -q "main.nf"; then
            echo "⚠ main.nf was modified - review for breaking changes"
          fi
          
          # Check if config changed
          if git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -q "nextflow.config"; then
            echo "⚠ nextflow.config was modified - review parameter changes"
          fi

      - name: Check for added dependencies
        run: |
          # Check if new containers were added
          if git diff origin/${{ github.base_ref }}...HEAD | grep -i "container.*="; then
            echo "⚠ New container dependencies detected - verify availability"
          fi

  changed-files:
    name: Analyze Changed Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          echo "Changed files in this PR:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD
          
          # Count file types
          WORKFLOW_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c "\.nf$" || echo "0")
          SCRIPTS_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c "bin/.*\.[rR]$" || echo "0")
          DOCS_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c "\.md$" || echo "0")
          
          echo "workflow_files=$WORKFLOW_CHANGED" >> $GITHUB_OUTPUT
          echo "script_files=$SCRIPTS_CHANGED" >> $GITHUB_OUTPUT
          echo "doc_files=$DOCS_CHANGED" >> $GITHUB_OUTPUT

      - name: Suggest reviewers
        run: |
          WORKFLOW_CHANGED=${{ steps.changed-files.outputs.workflow_files }}
          SCRIPTS_CHANGED=${{ steps.changed-files.outputs.script_files }}
          DOCS_CHANGED=${{ steps.changed-files.outputs.doc_files }}
          
          echo "📊 Change Summary:"
          echo "  Nextflow files: $WORKFLOW_CHANGED"
          echo "  R scripts: $SCRIPTS_CHANGED"
          echo "  Documentation: $DOCS_CHANGED"
          
          if [ "$WORKFLOW_CHANGED" -gt 0 ]; then
            echo "💡 Nextflow workflow expert review recommended"
          fi
          
          if [ "$SCRIPTS_CHANGED" -gt 0 ]; then
            echo "💡 Bioinformatics/R expert review recommended"
          fi

  size-label:
    name: Label PR Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR size and add label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            let additions = 0;
            let deletions = 0;
            files.forEach(file => {
              additions += file.additions;
              deletions += file.deletions;
            });
            
            const totalChanges = additions + deletions;
            let sizeLabel = '';
            
            if (totalChanges < 10) {
              sizeLabel = 'size/XS';
            } else if (totalChanges < 50) {
              sizeLabel = 'size/S';
            } else if (totalChanges < 250) {
              sizeLabel = 'size/M';
            } else if (totalChanges < 1000) {
              sizeLabel = 'size/L';
            } else {
              sizeLabel = 'size/XL';
            }
            
            // Remove old size labels
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            for (const label of labels) {
              if (label.name.startsWith('size/')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                }).catch(() => {});
              }
            }
            
            // Add new size label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel],
              });
            } catch (error) {
              console.log(`Could not add label ${sizeLabel}: ${error.message}`);
            }
            
            core.info(`PR size: ${totalChanges} lines changed (${sizeLabel})`);

  test-on-pr:
    name: Test Pipeline Changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.04.0"

      - name: Test config loading
        run: |
          nextflow config -profile standard > config_output.txt
          if [ -s config_output.txt ]; then
            echo "✓ Configuration loaded successfully"
            cat config_output.txt
          else
            echo "❌ Configuration failed to load"
            exit 1
          fi
